<!DOCTYPE html>
<html class="page" lang="en">

<include src="partials/head.html">
    {
        "title": "University of Tasmania"
    }
</include>

<body class="page__body">

    <include src="partials/header.html"></include>

    <main>
        <section class="hero-banner">
            <div class="hero-banner__video-container">
                <video id="heroBanner-video" class="hero-banner__video" autoplay muted loop data-video="https://www.utas.edu.au/__data/assets/video_file/0004/1555690/211215_UTAS_Banner_Final.mp4" data-video-tablet="https://www.utas.edu.au/__data/assets/video_file/0006/1558770/211215_UTAS_Banner_Tablet_Graded.mp4" data-video-mobile="https://www.utas.edu.au/__data/assets/video_file/0008/1558772/211215_UTAS_Banner_Mobile_Graded.mp4">
                    <source src="https://www.utas.edu.au/__data/assets/video_file/0008/1558772/211215_UTAS_Banner_Mobile_Graded.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="hero-banner__content">
                <div class="hero-banner__title-container">
                    <h1 class="hero-banner__title">
                        <span class="hero-banner-video__title--row1">#1 in climate</span> 
                        <span class="hero-banner-video__title--row2">action globally</span>
                    </h1>
                </div>
                
                <div class="hero-banner__link-buttons">
                    <a href="https://www.utas.edu.au/study/apply" class="hero-banner__link-button hero-banner__apply-button">
                    Apply
                    </a>
                    <a href="https://www.utas.edu.au/enquire?seedData=homepage" class="hero-banner__link-button hero-banner__enquire-button">
                    Enquire
                </a>
                </div>

                <button 
                    id="heroBanner-videoButton" 
                    class="hero-banner__button" 
                    aria-label="Pause video"
                    title="Pause video"
                    type ="button">
                    
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 20 20"
                        fill="none"
                        stroke="none"
                        >
                        <!-- Left bar / Play shape -->
                        <!-- Top-left (x,y), Top-right, Bottom-right, Bottom-left -->
                        <path
                            id="left-path"
                            fill="white"
                            
                            d="M0 0 L6 0 L6 20 L0 20 Z" 
                        />

                        <!-- Right pause bar -->
                        <path
                            id="right-path"
                            fill="white"

                            d="M14 0 L20 0 L20 20 L14 20 Z" 
                        />
                    </svg>
                </button>

            </div>

        </section>

        <section class="no-padding-content-container">
            <section class="search-bar">
                <form class="search-bar-input">
                    <input class="search-text" type="text" id="q" value="Search for a course...">
                    <button class="search-button" type="submit" aria-label="Course search">
                        <span class="search-toggle__icon"></span>
                    </button>
                </form>
            </section>
       
        <section class="course-section">
            <!-- Contains Title, 6 course cards in a grid layout.
                Each card has a hover effect (Title shifts to center and becomes red. A shadow is applied to 
                the card and the image stays unchanged. The card also has a link to the course page.)

                  h2 {
                        font-size: 34px;
                        line-height: 3.125rem;
                        letter-spacing: -0.94px;
                    }

            */ -->
            <div class="course-section__title"> 
                <h2 >Browse our courses</h2>
            </div>
            <div class="course-card-buttons">
                    <button class="course-card-button left-button" aria-label="Previous courses" title="Previous courses">
                        <img src="images/arrow-back.svg" alt="Previous courses">
                        
                    </button>
                    <button class="course-card-button right-button" aria-label="Next courses" title="Next courses">
                        <img src="images/arrow-forward.svg" alt="Next courses">
                    </button>
                </div>
            <div class="course-cards">
     
                <div class="course-card">
                    <img class="Business and Law course-image" src="images/browse-course-banner/law-students-hobart-city-law-precinct-1.jpg" alt="Business and Law">
                    <h3 class="course-card__title">Business and Law</h3>
                </div>
                <div class="course-card">
                    <img class="Creative Arts and Design course-image" src="images/browse-course-banner/fine-arts-design-student-hunter-street-campus-1.jpg" alt="Creative Arts and Design">
                    <h3 class="course-card__title">Creative Arts and Design</h3>
                </div>
                <div class="course-card">
                    <img class="Earth, Sea, Antarctic and Environment course-image" src="images/browse-course-banner/science-students-bisdee-tier-greenhill-observatory-1.jpg" alt="Earth, Sea, Antarctic and Environment">
                    <h3 class="course-card__title">Earth, Sea, Antarctic and Environment</h3>
                </div>
                <div class="course-card">
                    <img class="Education, Humanities and Social Sciences course-image" src="images/browse-course-banner/education-and-teaching-placement-taroona-primary-bush-class-1.jpg" alt="Education, Humanities and Social Sciences">
                    <h3 class="course-card__title">Education, Humanities and Social Sciences</h3>
                </div>
                <div class="course-card">
                    <img class="Health and Medicine course-image" src="images/browse-course-banner/nursing-students-sydney-campus-sydney-1.jpg" alt="Health and Medicine">
                    <h3 class="course-card__title">Health and Medicine</h3>
                </div>
                <div class="course-card">
                    <img class="Science, Technology and Engineering course-image" src="images/browse-course-banner/science-students-bisdee-tier-greenhill-observatory-1.jpg" alt="Science, Technology and Engineering">
                    <h3 class="course-card__title">Science, Technology and Engineering</h3>
                </div>
            </div>

        </section>
        <section class="adventure-section">
            <!-- Title, 2x2 grid of title and text blurb pertaining to title subject. -->
        </section> 
        <section class="thinkingUni-banner">

        </section>
        <section class="thinkinguni-section">

        </section>
        <section class="sustainability-section">

        </section>
        <section class="our-students-scroll-banner">

        </section>
         <section class="transform-university-section">

        </section>
        <section class="events-section">

        </section>
         <section class="news-section">

        </section>
         </section>
    </main>

    <include src="partials/footer.html"></include>

    <include src="partials/scripts.html"></include>
</body>

</html>
