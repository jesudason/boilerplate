<!DOCTYPE html>
<html class="page" lang="en">

<include src="partials/head.html">
    {
        "title": "University of Tasmania"
    }
</include>

<body class="page__body">

    <include src="partials/header.html"></include>

    <main>
        <section class="hero-banner">
            <div class="hero-banner__video-container">
                <video id="heroBanner-video" class="hero-banner__video" autoplay muted loop data-video="https://www.utas.edu.au/__data/assets/video_file/0004/1555690/211215_UTAS_Banner_Final.mp4" data-video-tablet="https://www.utas.edu.au/__data/assets/video_file/0006/1558770/211215_UTAS_Banner_Tablet_Graded.mp4" data-video-mobile="https://www.utas.edu.au/__data/assets/video_file/0008/1558772/211215_UTAS_Banner_Mobile_Graded.mp4">
                    <source src="https://www.utas.edu.au/__data/assets/video_file/0008/1558772/211215_UTAS_Banner_Mobile_Graded.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="hero-banner__content">
                <div class="hero-banner__title-container">
                    <h1 class="hero-banner__title">
                        <span class="hero-banner-video__title--row1">#1 in climate</span> 
                        <span class="hero-banner-video__title--row2">action globally</span>
                    </h1>
                </div>
                
                <div class="hero-banner__link-buttons">
                    <a href="https://www.utas.edu.au/study/apply" class="hero-banner__link-button hero-banner__apply-button">
                    Apply
                    </a>
                    <a href="https://www.utas.edu.au/enquire?seedData=homepage" class="hero-banner__link-button hero-banner__enquire-button">
                    Enquire
                </a>
                </div>

                <button 
                    id="heroBanner-videoButton" 
                    class="hero-banner__button" 
                    aria-label="Pause video"
                    title="Pause video"
                    type ="button">
                    
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 20 20"
                        fill="none"
                        stroke="none"
                        >
                        <!-- Left bar / Play shape -->
                        <!-- Top-left (x,y), Top-right, Bottom-right, Bottom-left -->
                        <path
                            id="leftPath"
                            fill="white"
                            
                            d="M0 0 L6 0 L6 20 L0 20 Z" 
                        />

                        <!-- Right pause bar -->
                        <path
                            id="rightPath"
                            fill="white"

                            d="M14 0 L20 0 L20 20 L14 20 Z" 
                        />
                    </svg>
                </button>

            </div>

        </section>
        <section class="search_bar">
            <form class="search_bar_input">
                <input class="search_text" type="text" id="q" value="Search for a course...">
                <button class="search_button" type="submit" aria-label="Course search">
                    <span class="search-toggle__icon"></span>
                </button>
            </form>
        </section>
    </main>

    <include src="partials/footer.html"></include>

    <include src="partials/scripts.html"></include>
</body>

</html>
