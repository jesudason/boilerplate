<header class="header"> 
    <div class="header__wrapper"> 
    
        <button class="hamburger" aria-controls="main-menu" aria-expanded="false">
            <div class="hamburger__container">
                <span class="hamburger__icon"></span>
            </div>
        </button>

        
        <div class="header__crest header__crest--dual">
            <div class="header__logo-utas">
                <a href="/">
                    <img src="images/logo.svg" alt="Company Logo">
                </a>
            </div>
            <div class="header__logo-climate">
                <a href="/">
                    <img src="images/logo-climate-action.svg" alt="Climate Logo">
                </a>
            </div>
        </div>

        <div class="header__actions">
            <button class="search" aria-controls="search-bar" aria-expanded="false">
                <div class="search__container">
                    <img src="images/Search_Icon.svg" alt="Search" class="search__icon">
                </div>
            </button>
        </div>

    </div>
</header>
